[project]
name = "dcf-valuation"
version = "0.1.0"
description = "Transparent discounted cash flow (DCF) model for US public companies, built on official SEC EDGAR data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robin-Philip Rehschuh" }]
requires-python = ">=3.11"
keywords = ["finance", "valuation", "dcf", "sec-edgar", "corporate-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "scipy>=1.11",
    "yfinance>=0.2.50",
]

[project.scripts]
dcf = "dcf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
    "pandas>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
