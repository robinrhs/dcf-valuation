# Assumptions for the synthetic offline fixture (tests/fixtures/companyfacts_example.json).
# Used by:  python -m dcf value EXMPL --fixture tests/fixtures/companyfacts_example.json \
#              --config config/example_offline.yaml --offline
# "Example Corp" is fictional; its price and beta are made up for demonstration only.

market:
  price: 30.00
  beta: 1.10

# Defining scenarios here replaces the default bull/base/bear set completely.
scenarios:
  base:
    revenue_growth_start: 0.09   # slightly below the ~10.6% CAGR of FY2023-FY2025 (2 periods)
    ebit_margin_target: 0.24     # +1pp vs. the last reported 23% margin
    terminal_growth: 0.025
    exit_multiple: 11.0
  bull:
    revenue_growth_start: 0.12
    ebit_margin_target: 0.26
    terminal_growth: 0.03
    exit_multiple: 13.0
  bear:
    revenue_growth_start: 0.05
    ebit_margin_target: 0.20
    terminal_growth: 0.02
    exit_multiple: 9.0
